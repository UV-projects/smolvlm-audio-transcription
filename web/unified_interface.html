<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Presentation Control - VLM + STT + PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* PDF Viewer Section */
        .pdf-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .pdf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .pdf-title {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        #pdfConnectionStatus {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .connected {
            background-color: #4CAF50;
            color: white;
        }

        .disconnected {
            background-color: #f44336;
            color: white;
        }

        #slideContainer {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            margin-bottom: 15px;
        }

        #slideImage {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .loading-message {
            color: white;
            font-size: 18px;
        }

        .pdf-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .pdf-controls button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .pdf-controls button:hover:not(:disabled) {
            background-color: #45a049;
        }

        .pdf-controls button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        .upload-button {
            background-color: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-right: 8px;
        }

        .upload-button:hover {
            background-color: #5568d3;
        }

        #slideInfo {
            color: white;
            font-size: 16px;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        /* Video & Control Section */
        .control-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        #videoFeed {
            width: 100%;
            max-height: 400px;
            border: 3px solid #667eea;
            border-radius: 8px;
            background-color: #000;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea[readonly] {
            background-color: #f5f5f5;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        #startButton {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: all 0.3s;
        }

        #startButton.start {
            background-color: #28a745;
        }

        #startButton.start:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        #startButton.stop {
            background-color: #dc3545;
        }

        #startButton.stop:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-indicator.active {
            background-color: #4CAF50;
            animation: pulse 2s infinite;
        }

        .status-indicator.inactive {
            background-color: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Unified Presentation Control System</h1>

        <div class="main-layout">
            <!-- LEFT: PDF Presentation Viewer -->
            <div class="pdf-section">
                <div class="pdf-header">
                    <div class="pdf-title">📊 Presentation Slides</div>
                    <div id="pdfConnectionStatus" class="disconnected">Disconnected</div>
                </div>

                <div class="pdf-upload-section" style="margin-bottom: 15px; text-align: center;">
                    <input type="file" id="pdfFileInput" accept=".pdf" onchange="handlePdfUpload(event)" style="display: none;">
                    <button class="upload-button" onclick="document.getElementById('pdfFileInput').click()" style="background-color: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;">
                        📤 Upload PDF
                    </button>
                </div>

                <div id="slideContainer">
                    <img id="slideImage" alt="PDF Slide" style="display: none;">
                    <div id="loadingMessage" class="loading-message">Waiting for PDF server...</div>
                </div>

                <div class="pdf-controls">
                    <button id="prevBtn" onclick="previousSlide()" disabled>← Previous</button>
                    <div id="slideInfo">-/-</div>
                    <button id="nextBtn" onclick="nextSlide()" disabled>Next →</button>
                </div>
            </div>

            <!-- RIGHT: Video Feed & Controls -->
            <div class="control-section">
                <div class="section-title">🎥 Video Feed</div>
                <div style="margin-bottom: 12px;">
                    <input type="file" id="videoFileInput" accept="video/*" onchange="handleVideoUpload(event)" style="display: none;">
                    <button class="upload-button" onclick="document.getElementById('videoFileInput').click()">🎬 Upload Video</button>
                    <span id="videoStatusText" style="font-size: 13px; color: #444;">No video selected</span>
                </div>
                <video id="videoFeed" autoplay playsinline></video>
                <canvas id="canvas" class="hidden"></canvas>

                <div class="input-group">
                    <label for="baseURL">VLM Server URL:</label>
                    <input type="text" id="baseURL" value="http://localhost:8080">
                </div>

                <div class="input-group">
                    <label for="instructionText">Instruction for VLM:</label>
                    <textarea id="instructionText" rows="2" placeholder="What do you see?">Describe the pose of the person in 8 words or fewer. Do not add any context to the output.</textarea>
                </div>

                <div class="input-group">
                    <label for="responseText">🤖 VLM Response:</label>
                    <textarea id="responseText" rows="3" readonly placeholder="AI responses will appear here..."></textarea>
                </div>

                <div class="input-group">
                    <label for="sttResponseText">🎤 Audio Transcription:</label>
                    <textarea id="sttResponseText" rows="3" readonly placeholder="Live speech transcription will appear here..."></textarea>
                </div>
            </div>
        </div>

        <!-- Bottom: Control Bar -->
        <div class="controls-bar">
            <label for="intervalSelect">Analysis Interval:</label>
            <select id="intervalSelect">
                <option value="100">100ms</option>
                <option value="250">250ms</option>
                <option value="500" selected>500ms</option>
                <option value="1000">1s</option>
                <option value="2000">2s</option>
            </select>
            <button id="startButton" class="start">▶ Start System</button>
            <div style="margin-left: 20px;">
                <span class="status-indicator inactive" id="systemStatus"></span>
                <span id="systemStatusText">System Idle</span>
            </div>
            <div style="margin-left: 20px;">
                <span class="status-indicator inactive" id="gestureStatus"></span>
                <span id="gestureStatusText">Gesture Control</span>
            </div>
        </div>
    </div>

    <script>
        // ========== PDF VIEWER LOGIC ==========
        let pdfSocket;
        let currentSlide = 0;
        let totalSlides = 0;

        function connectToPdfServer() {
            const wsUrl = 'ws://localhost:9002/viewer';

            try {
                pdfSocket = new WebSocket(wsUrl);

                pdfSocket.onopen = function(event) {
                    console.log('Connected to PDF server');
                    document.getElementById('pdfConnectionStatus').textContent = 'Connected';
                    document.getElementById('pdfConnectionStatus').className = 'connected';

                    // Request initial slide
                    pdfSocket.send(JSON.stringify({ command: 'refresh' }));
                };

                pdfSocket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);

                        if (data.type === 'slide_update') {
                            currentSlide = data.slide_number;
                            totalSlides = data.total_slides;

                            // Update slide image
                            const slideImage = document.getElementById('slideImage');
                            slideImage.src = 'data:image/png;base64,' + data.image;
                            slideImage.style.display = 'block';
                            document.getElementById('loadingMessage').style.display = 'none';

                            // Update slide counter
                            document.getElementById('slideInfo').textContent =
                                `${currentSlide + 1} / ${totalSlides}`;

                            // Update button states
                            document.getElementById('prevBtn').disabled = (currentSlide === 0);
                            document.getElementById('nextBtn').disabled = (currentSlide === totalSlides - 1);
                        }
                    } catch (e) {
                        console.error('Error parsing PDF message:', e);
                    }
                };

                pdfSocket.onclose = function(event) {
                    console.log('Disconnected from PDF server');
                    document.getElementById('pdfConnectionStatus').textContent = 'Disconnected';
                    document.getElementById('pdfConnectionStatus').className = 'disconnected';
                    document.getElementById('prevBtn').disabled = true;
                    document.getElementById('nextBtn').disabled = true;

                    // Attempt to reconnect after 3 seconds
                    setTimeout(connectToPdfServer, 3000);
                };

                pdfSocket.onerror = function(error) {
                    console.error('PDF WebSocket error:', error);
                    document.getElementById('loadingMessage').textContent =
                        'Error: PDF server not running. Start pdf_server.py first.';
                };

            } catch (e) {
                console.error('Connection error:', e);
            }
        }

        function nextSlide() {
            if (pdfSocket && pdfSocket.readyState === WebSocket.OPEN) {
                pdfSocket.send(JSON.stringify({ command: 'next' }));
            }
        }

        function previousSlide() {
            if (pdfSocket && pdfSocket.readyState === WebSocket.OPEN) {
                pdfSocket.send(JSON.stringify({ command: 'previous' }));
            }
        }

        async function handlePdfUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                alert('Please select a PDF file');
                return;
            }

            console.log('Uploading PDF:', file.name);
            document.getElementById('loadingMessage').textContent = 'Uploading PDF...';
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('slideImage').style.display = 'none';

            try {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const arrayBuffer = e.target.result;
                    const base64String = btoa(
                        new Uint8Array(arrayBuffer).reduce(
                            (data, byte) => data + String.fromCharCode(byte), ''
                        )
                    );

                    if (pdfSocket && pdfSocket.readyState === WebSocket.OPEN) {
                        pdfSocket.send(JSON.stringify({
                            command: 'upload_pdf',
                            pdf_data: base64String
                        }));
                    } else {
                        alert('WebSocket not connected. Please wait and try again.');
                        document.getElementById('loadingMessage').textContent = 'Connection error';
                    }
                };

                reader.onerror = function() {
                    alert('Error reading file');
                    document.getElementById('loadingMessage').textContent = 'Error reading file';
                };

                reader.readAsArrayBuffer(file);

            } catch (error) {
                console.error('Error uploading PDF:', error);
                alert('Error uploading PDF: ' + error.message);
                document.getElementById('loadingMessage').textContent = 'Upload failed';
            }
        }

        // ========== VLM & STT LOGIC ==========
        const video = document.getElementById('videoFeed');
        const canvas = document.getElementById('canvas');
        const baseURL = document.getElementById('baseURL');
        const instructionText = document.getElementById('instructionText');
        const responseText = document.getElementById('responseText');
        const intervalSelect = document.getElementById('intervalSelect');
        const startButton = document.getElementById('startButton');
        const sttResponseText = document.getElementById('sttResponseText');
        const systemStatus = document.getElementById('systemStatus');
        const systemStatusText = document.getElementById('systemStatusText');
        const gestureStatus = document.getElementById('gestureStatus');
        const gestureStatusText = document.getElementById('gestureStatusText');
        const videoStatusText = document.getElementById('videoStatusText');

        let sttSocket;
        let orchestratorSocket;
        let gestureSocket;
        let intervalId;
        let gestureFrameIntervalId;
        let isProcessing = false;
        let videoReady = false;
        let uploadedVideoObjectUrl = null;
        let sttAudioStream = null;
        let sttAudioContext = null;
        let sttAudioSource = null;
        let sttAudioProcessor = null;
        let sttSilenceGain = null;

        // VLM Functions
        async function sendChatCompletionRequest(instruction, imageBase64URL) {
            const systemPrompt = "You are a vision analysis expert specializing in human pose detection and kinesics. You provide precise, structured observations focusing on body spatial positioning.";

            const response = await fetch(`${baseURL.value}/v1/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    max_tokens: 100,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: [
                            { type: 'text', text: instruction },
                            { type: 'image_url', image_url: { url: imageBase64URL } }
                        ] },
                    ]
                })
            });
            if (!response.ok) {
                const errorData = await response.text();
                return `Server error: ${response.status} - ${errorData}`;
            }
            const data = await response.json();
            return data.choices[0].message.content;
        }

        function captureImage() {
            if (!videoReady || !video.videoWidth || video.paused || video.ended) {
                return null;
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8);
        }

        async function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('video/')) {
                alert('Please select a valid video file.');
                return;
            }

            if (uploadedVideoObjectUrl) {
                URL.revokeObjectURL(uploadedVideoObjectUrl);
                uploadedVideoObjectUrl = null;
            }

            uploadedVideoObjectUrl = URL.createObjectURL(file);
            video.srcObject = null;
            video.src = uploadedVideoObjectUrl;
            video.currentTime = 0;

            try {
                await video.play();
                videoReady = true;
                videoStatusText.textContent = `Loaded: ${file.name}`;
                responseText.value = 'Video ready. Click Start System to begin.';
            } catch (err) {
                console.warn('Video play pending user interaction:', err);
                videoReady = true;
                videoStatusText.textContent = `Loaded: ${file.name} (press play if needed)`;
            }
        }

        async function sendData() {
            if (!isProcessing) return;

            const instruction = instructionText.value;
            const imageBase64URL = captureImage();

            if (!imageBase64URL) {
                responseText.value = "Failed to capture image.";
                return;
            }

            try {
                const response = await sendChatCompletionRequest(instruction, imageBase64URL);
                responseText.value = response;

                // Forward to Orchestrator
                if (orchestratorSocket && orchestratorSocket.readyState === WebSocket.OPEN) {
                    const orchestratorPayload = {
                        source: "vision_vlm",
                        content: response
                    };
                    orchestratorSocket.send(JSON.stringify(orchestratorPayload));
                }
            } catch (error) {
                console.error('Error sending data:', error);
                responseText.value = `Error: ${error.message}`;
            }
        }

        // STT WebSocket
        function setupSttWebSocket() {
            if (sttSocket) sttSocket.close();

            sttSocket = new WebSocket('ws://localhost:2700');
            sttSocket.binaryType = 'arraybuffer';

            sttSocket.onopen = async function() {
                console.log("STT connected");
                sttResponseText.value = "[Connected to audio server, using video audio]\n";

                try {
                    if (video.paused) {
                        await video.play();
                    }

                    const captureFn = video.captureStream || video.webkitCaptureStream || video.mozCaptureStream;
                    if (!captureFn) {
                        throw new Error('Video audio capture is not supported by this browser.');
                    }

                    sttAudioStream = captureFn.call(video);
                    if (!sttAudioStream || sttAudioStream.getAudioTracks().length === 0) {
                        throw new Error('Selected video has no audio track.');
                    }

                    sttAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    sttAudioSource = sttAudioContext.createMediaStreamSource(sttAudioStream);
                    sttAudioProcessor = sttAudioContext.createScriptProcessor(4096, 2, 1);
                    sttSilenceGain = sttAudioContext.createGain();
                    sttSilenceGain.gain.value = 0;

                    sttAudioProcessor.onaudioprocess = (e) => {
                        if (!sttSocket || sttSocket.readyState !== WebSocket.OPEN) return;

                        const numChannels = e.inputBuffer.numberOfChannels;
                        if (numChannels === 0) return;

                        const left = e.inputBuffer.getChannelData(0);
                        const right = numChannels > 1 ? e.inputBuffer.getChannelData(1) : left;
                        const int16Data = new Int16Array(left.length);

                        for (let i = 0; i < left.length; i++) {
                            const mono = numChannels > 1 ? (left[i] + right[i]) * 0.5 : left[i];
                            const s = Math.max(-1, Math.min(1, mono));
                            int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }

                        sttSocket.send(int16Data.buffer);
                    };

                    sttAudioSource.connect(sttAudioProcessor);
                    sttAudioProcessor.connect(sttSilenceGain);
                    sttSilenceGain.connect(sttAudioContext.destination);
                } catch (err) {
                    console.error('Video audio capture error:', err);
                    sttResponseText.value += '\n[Video audio error: ' + err.message + ']';
                }
            };

            sttSocket.onmessage = function(event) {
                try {
                    const parsed = JSON.parse(event.data);
                    const text = (parsed && parsed.text) ? parsed.text : '';
                    if (text) {
                        sttResponseText.value += text + '\n';
                        sttResponseText.scrollTop = sttResponseText.scrollHeight;

                        if (orchestratorSocket && orchestratorSocket.readyState === WebSocket.OPEN) {
                            orchestratorSocket.send(JSON.stringify({
                                source: 'audio_stt',
                                content: text
                            }));
                        }
                    }
                } catch (_err) {
                    if (event.data) {
                        sttResponseText.value += event.data + '\n';
                        sttResponseText.scrollTop = sttResponseText.scrollHeight;
                    }
                }
            };

            sttSocket.onclose = function() {
                console.log("STT disconnected");
                if (isProcessing) {
                    sttResponseText.value += "\n[Disconnected from audio server]";
                }
                stopSttAudioPipeline();
            };

            sttSocket.onerror = function(error) {
                console.error("STT error:", error);
                sttResponseText.value = "[Error: Audio server not running]";
            };
        }

        function stopSttAudioPipeline() {
            if (sttAudioProcessor) {
                sttAudioProcessor.disconnect();
                sttAudioProcessor.onaudioprocess = null;
                sttAudioProcessor = null;
            }
            if (sttAudioSource) {
                sttAudioSource.disconnect();
                sttAudioSource = null;
            }
            if (sttSilenceGain) {
                sttSilenceGain.disconnect();
                sttSilenceGain = null;
            }
            if (sttAudioContext) {
                sttAudioContext.close();
                sttAudioContext = null;
            }
            sttAudioStream = null;
        }

        // Orchestrator WebSocket
        function setupOrchestratorWebSocket() {
            if (orchestratorSocket) orchestratorSocket.close();

            orchestratorSocket = new WebSocket('ws://localhost:9001');

            orchestratorSocket.onopen = function() {
                console.log("Orchestrator connected");
            };

            orchestratorSocket.onclose = function() {
                console.log("Orchestrator disconnected");
            };

            orchestratorSocket.onerror = function(error) {
                console.error("Orchestrator error:", error);
            };
        }

        // Gesture Control WebSocket
        function setupGestureWebSocket() {
            if (gestureSocket) gestureSocket.close();

            gestureSocket = new WebSocket('ws://localhost:9003');

            gestureSocket.onopen = function() {
                console.log("Gesture control connected");
                gestureStatus.classList.remove('inactive');
                gestureStatus.classList.add('active');
                gestureStatusText.textContent = "Gesture Control Active";

                if (gestureFrameIntervalId) {
                    clearInterval(gestureFrameIntervalId);
                }

                gestureFrameIntervalId = setInterval(() => {
                    if (!isProcessing) return;
                    if (!gestureSocket || gestureSocket.readyState !== WebSocket.OPEN) return;

                    const frameData = captureImage();
                    if (!frameData) return;

                    gestureSocket.send(JSON.stringify({
                        type: 'frame',
                        image: frameData.split(',')[1]
                    }));
                }, 100);
            };

            gestureSocket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'gesture') {
                        console.log('Received gesture:', data.action);
                        if (data.action === 'next') {
                            nextSlide();
                        } else if (data.action === 'previous') {
                            previousSlide();
                        }
                    }
                } catch (e) {
                    console.error('Error parsing gesture message:', e);
                }
            };

            gestureSocket.onclose = function() {
                console.log("Gesture control disconnected");
                gestureStatus.classList.remove('active');
                gestureStatus.classList.add('inactive');
                gestureStatusText.textContent = "Gesture Control";
                if (gestureFrameIntervalId) {
                    clearInterval(gestureFrameIntervalId);
                    gestureFrameIntervalId = null;
                }
                // Optional: try to reconnect
                setTimeout(setupGestureWebSocket, 5000);
            };

            gestureSocket.onerror = function(error) {
                console.error("Gesture WebSocket error:", error);
                gestureStatus.classList.remove('active');
                gestureStatus.classList.add('inactive');
                gestureStatusText.textContent = "Gesture Error";
                if (gestureFrameIntervalId) {
                    clearInterval(gestureFrameIntervalId);
                    gestureFrameIntervalId = null;
                }
            };
        }

        // Start/Stop handlers
        function handleStart() {
            if (!videoReady) {
                alert("Upload a video first.");
                return;
            }

            if (video.paused) {
                video.play().catch(() => {});
            }

            isProcessing = true;
            startButton.textContent = "⏹ Stop System";
            startButton.classList.remove('start');
            startButton.classList.add('stop');
            systemStatus.classList.remove('inactive');
            systemStatus.classList.add('active');
            systemStatusText.textContent = "System Running";

            instructionText.disabled = true;
            intervalSelect.disabled = true;
            baseURL.disabled = true;

            responseText.value = "System started...";
            const intervalMs = parseInt(intervalSelect.value, 10);
            sendData();
            intervalId = setInterval(sendData, intervalMs);

            setupOrchestratorWebSocket();
            setupSttWebSocket();
        }

        function handleStop() {
            isProcessing = false;
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }

            if (sttSocket) sttSocket.close();
            if (orchestratorSocket) orchestratorSocket.close();
            if (gestureSocket) gestureSocket.close();
            stopSttAudioPipeline();

            if (gestureFrameIntervalId) {
                clearInterval(gestureFrameIntervalId);
                gestureFrameIntervalId = null;
            }

            startButton.textContent = "▶ Start System";
            startButton.classList.remove('stop');
            startButton.classList.add('start');
            systemStatus.classList.remove('active');
            systemStatus.classList.add('inactive');
            systemStatusText.textContent = "System Idle";

            instructionText.disabled = false;
            intervalSelect.disabled = false;
            baseURL.disabled = false;

            responseText.value = "System stopped.";
            sttResponseText.value += "\n[System stopped]";
        }

        // Event Listeners
        startButton.addEventListener('click', () => {
            if (isProcessing) {
                handleStop();
            } else {
                handleStart();
            }
        });

        // Keyboard shortcuts for PDF
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight' || event.key === ' ') {
                event.preventDefault();
                nextSlide();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                previousSlide();
            }
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            connectToPdfServer();
            setupGestureWebSocket();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopSttAudioPipeline();
            if (sttSocket) sttSocket.close();
            if (orchestratorSocket) orchestratorSocket.close();
            if (pdfSocket) pdfSocket.close();
            if (gestureSocket) gestureSocket.close();
            if (gestureFrameIntervalId) clearInterval(gestureFrameIntervalId);
            if (uploadedVideoObjectUrl) URL.revokeObjectURL(uploadedVideoObjectUrl);
        });
    </script>
</body>
</html>

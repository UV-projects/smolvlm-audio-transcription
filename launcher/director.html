<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Director — Live Demo</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1d2430; --muted:#5b6573;
    --line:#dfe3ea; --accent:#3b5bdb; --accent-soft:#e7ecfb;
    --ok:#1f9d57; --warn:#b9770a; --err:#c2392f; --field:#f7f8fa;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
  }
  .wrap{max-width:920px; margin:0 auto; padding:22px 20px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px;}
  h1{font-size:20px; margin:0; letter-spacing:.2px;}
  h1 span{color:var(--muted); font-weight:500;}
  .pill{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:7px 14px; font-size:13px; color:var(--muted); white-space:nowrap;}
  .dot{width:9px; height:9px; border-radius:50%; background:#c2c8d2; flex:none;}
  .dot.on{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.off{background:#c2c8d2}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
  .controls{display:flex; flex-wrap:wrap; gap:14px 18px; align-items:flex-end;}
  .ctl{display:flex; flex-direction:column; gap:6px;}
  .ctl label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  select, input[type=text], textarea{
    font:inherit; color:var(--ink); background:var(--field); border:1px solid var(--line);
    border-radius:9px; padding:9px 11px; outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--accent); background:#fff;}
  select{min-width:230px; cursor:pointer;}

  .seg{display:inline-flex; background:var(--field); border:1px solid var(--line); border-radius:10px; padding:3px;}
  .seg button{border:none; background:transparent; color:var(--muted); font:inherit; font-weight:600;
    padding:7px 14px; border-radius:8px; cursor:pointer;}
  .seg button.active{background:var(--accent); color:#fff;}

  .btn{border:none; border-radius:10px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:disabled{background:#aeb8cf; cursor:not-allowed;}
  .btn-ghost{background:var(--field); color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:disabled{opacity:.5; cursor:not-allowed;}
  .spacer{flex:1 1 auto;}

  .label{font-size:15px; font-weight:700; margin:2px 0 8px;}
  #videoFeed{width:100%; aspect-ratio:16/9; background:#000; border:3px solid var(--accent);
    border-radius:12px; object-fit:contain; display:block;}
  .hidden{display:none;}
  .readout{width:100%; background:var(--field); border:1px solid var(--line); border-radius:10px;
    padding:13px 14px; min-height:54px; color:var(--ink); white-space:pre-wrap; overflow-y:auto;}
  #vlmOut{min-height:54px;}
  #sttOut{min-height:92px; max-height:160px; font-variant-numeric:tabular-nums;}

  .filerow{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .muted{color:var(--muted); font-size:13px;}
  details{margin-top:4px;}
  details>summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); list-style:none;
    padding:6px 0;}
  details>summary::-webkit-details-marker{display:none;}
  details>summary::before{content:"›"; display:inline-block; margin-right:8px; transition:transform .15s;}
  details[open]>summary::before{transform:rotate(90deg);}
  .adv{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px;}
  .adv .full{grid-column:1 / -1;}
  .adv textarea{width:100%; resize:vertical;}
  footer{margin-top:8px; text-align:center; color:var(--muted); font-size:12.5px;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222a3a; color:#fff;
    padding:11px 18px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Director <span>— Live Demo</span></h1>
    <div class="pill"><span class="dot off" id="beDot"></span><span id="beText">Backend stopped</span></div>
  </header>

  <!-- Control panel -->
  <div class="panel">
    <div class="controls">
      <div class="ctl">
        <label>Source</label>
        <div class="seg" id="sourceSeg">
          <button data-src="webcam" class="active">Webcam</button>
          <button data-src="video">Video file</button>
        </div>
      </div>
      <div class="ctl">
        <label for="modelSelect">Vision model</label>
        <select id="modelSelect"><option>Loading…</option></select>
      </div>
      <div class="ctl">
        <label for="sttSelect">Speech model</label>
        <select id="sttSelect"><option>Loading…</option></select>
      </div>
      <div class="ctl">
        <label for="intervalSelect">Analysis interval</label>
        <select id="intervalSelect">
          <option value="400">400 ms</option>
          <option value="600">600 ms</option>
          <option value="1000" selected>1 s</option>
          <option value="1500">1.5 s</option>
          <option value="2000">2 s</option>
        </select>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="startBtn">Start</button>
      <button class="btn btn-ghost" id="stopBtn" disabled>Stop</button>
      <button class="btn btn-ghost" id="restartBtn" disabled>Restart</button>
    </div>
    <div class="filerow hidden" id="fileRow" style="margin-top:14px;">
      <input type="file" id="videoFile" accept="video/*" class="hidden">
      <button class="btn btn-ghost" id="chooseVideo">Choose video…</button>
      <span class="muted" id="videoName">No video selected</span>
    </div>
  </div>

  <!-- Camera feed -->
  <div class="panel">
    <div class="label">Camera Feed</div>
    <video id="videoFeed" autoplay playsinline muted></video>
    <canvas id="canvas" class="hidden"></canvas>
  </div>

  <!-- VLM response -->
  <div class="panel">
    <div class="label">VLM Response</div>
    <div class="readout" id="vlmOut">Idle. Choose a source and press Start.</div>
  </div>

  <!-- Audio transcription -->
  <div class="panel">
    <div class="label">Audio Transcription</div>
    <div class="readout" id="sttOut">Idle.</div>
  </div>

  <!-- Advanced (system prompt tucked away) -->
  <div class="panel">
    <details id="advanced">
      <summary>Advanced settings</summary>
      <div class="adv">
        <div class="full">
          <label class="muted">Instruction (sent with every frame)</label>
          <textarea id="instruction" rows="2">Describe the pose of the person in 8 words or fewer. Do not add any context to the output.</textarea>
        </div>
        <div class="full">
          <label class="muted">System prompt</label>
          <textarea id="systemPrompt" rows="2">You are a vision analysis expert specializing in human pose detection and kinesics. You provide precise, structured observations focusing on body spatial positioning.</textarea>
        </div>
        <div>
          <label class="muted">Max tokens</label>
          <input type="text" id="maxTokens" value="64">
        </div>
        <div>
          <label class="muted">Frame width (px, downscaled)</label>
          <input type="text" id="frameWidth" value="640">
        </div>
      </div>
    </details>
  </div>

  <footer>Runs entirely on this machine. Audio and video never leave your computer.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const video = $('videoFeed'), canvas = $('canvas');
let source = 'webcam';
let running = false;            // capture loop active
let frameTimer = null;
let sttSocket = null;
let mediaStream = null;         // webcam stream (video+audio)
let audioCtx=null, audioSrc=null, audioProc=null, silence=null;
let busyVlm = false;
let pollTimer = null;

function toast(msg){const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function setBackend(state, text){const d=$('beDot'); d.className='dot '+state; $('beText').textContent=text;}

/* ---------- Backend status ---------- */
async function getStatus(){
  try{const r=await fetch('/api/status'); if(!r.ok) return null; return await r.json();}
  catch(e){return null;}
}
function renderModels(st){
  const sel=$('modelSelect');
  if(!st || !st.models){sel.innerHTML='<option>Backend offline</option>'; return;}
  const cur=sel.value;
  sel.innerHTML='';
  for(const m of st.models){
    const o=document.createElement('option');
    o.value=m.id; o.textContent=m.name+(m.note?'  ·  '+m.note:'')+(m.ready?'':'  (download needed)');
    sel.appendChild(o);
  }
  sel.value = cur && st.models.some(m=>m.id===cur) ? cur : (st.active_model||st.models[0].id);
}
function renderSttModels(st){
  const sel=$('sttSelect');
  if(!st || !st.stt_models){sel.innerHTML='<option>Backend offline</option>'; return;}
  const cur=sel.value;
  sel.innerHTML='';
  for(const m of st.stt_models){
    const o=document.createElement('option');
    o.value=m.id; o.textContent=m.name+(m.note?'  ·  '+m.note:'')+(m.ready?'':'  (download needed)');
    sel.appendChild(o);
  }
  sel.value = cur && st.stt_models.some(m=>m.id===cur) ? cur : (st.stt&&st.stt.model_id?st.stt.model_id:st.stt_models[0].id);
}
function renderStatus(st){
  if(!st){setBackend('off','Backend offline'); return;}
  if(st.vlm && st.vlm.running){
    const mem = st.mem_mb ? ('  ·  '+(st.mem_mb/1024).toFixed(1)+' GB') : '';
    setBackend(st.vlm.ready?'on':'busy', (st.vlm.ready?'Running: ':'Loading: ')+(st.vlm.model_name||st.active_model)+(st.stt&&st.stt.running?'  ·  STT on':'')+mem);
  } else {
    setBackend('off','Backend stopped');
  }
}
async function refresh(){const st=await getStatus(); renderModels(st); renderSttModels(st); renderStatus(st); return st;}

/* ---------- Source switching ---------- */
$('sourceSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(running){toast('Stop the system before changing source.'); return;}
  [...e.currentTarget.children].forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); source=b.dataset.src;
  $('fileRow').classList.toggle('hidden', source!=='webcam'?false:true);
  $('fileRow').classList.toggle('hidden', source!=='video');
});
$('chooseVideo').onclick=()=>$('videoFile').click();
$('videoFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  video.srcObject=null; video.muted=true; video.loop=true;
  video.src=URL.createObjectURL(f); $('videoName').textContent=f.name;
  video.play().catch(()=>{});
};

async function startWebcam(){
  mediaStream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280}},audio:true});
  video.srcObject=mediaStream; video.src=''; video.muted=true;
  await video.play().catch(()=>{});
}

/* ---------- VLM frame loop ---------- */
function captureFrame(){
  if(!video.videoWidth || video.paused || video.ended) return null;
  const maxW=parseInt($('frameWidth').value)||640;
  const scale=Math.min(1, maxW/video.videoWidth);
  canvas.width=Math.round(video.videoWidth*scale);
  canvas.height=Math.round(video.videoHeight*scale);
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',0.7);
}
async function askVlm(){
  if(!running || busyVlm) return;
  const img=captureFrame(); if(!img) return;
  busyVlm=true;
  try{
    const r=await fetch('/v1/chat/completions',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        max_tokens: parseInt($('maxTokens').value)||64,
        messages:[
          {role:'system', content:$('systemPrompt').value},
          {role:'user', content:[
            {type:'text', text:$('instruction').value},
            {type:'image_url', image_url:{url:img}}
          ]}
        ]
      })
    });
    if(!r.ok){$('vlmOut').textContent='VLM error '+r.status+'. Is the backend running?'; return;}
    const d=await r.json();
    $('vlmOut').textContent=(d.choices&&d.choices[0]&&d.choices[0].message.content||'').trim();
  }catch(e){$('vlmOut').textContent='VLM request failed: '+e.message;}
  finally{busyVlm=false;}
}

/* ---------- Vosk STT ---------- */
function startStt(){
  if(sttSocket) try{sttSocket.close()}catch(e){}
  sttSocket=new WebSocket('ws://127.0.0.1:2700');
  sttSocket.binaryType='arraybuffer';
  sttSocket.onopen=async()=>{
    try{
      let aStream;
      if(source==='webcam'){
        aStream = mediaStream ? new MediaStream(mediaStream.getAudioTracks()) : null;
      } else {
        const cap=video.captureStream||video.webkitCaptureStream||video.mozCaptureStream;
        aStream = cap?cap.call(video):null;
      }
      if(!aStream || aStream.getAudioTracks().length===0){
        $('sttOut').textContent='No audio track on this source.'; return;
      }
      audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
      audioSrc=audioCtx.createMediaStreamSource(aStream);
      audioProc=audioCtx.createScriptProcessor(4096,1,1);
      silence=audioCtx.createGain(); silence.gain.value=0;
      audioProc.onaudioprocess=ev=>{
        if(!sttSocket||sttSocket.readyState!==WebSocket.OPEN) return;
        const inp=ev.inputBuffer.getChannelData(0);
        const out=new Int16Array(inp.length);
        for(let i=0;i<inp.length;i++){const s=Math.max(-1,Math.min(1,inp[i])); out[i]=s<0?s*0x8000:s*0x7FFF;}
        sttSocket.send(out.buffer);
      };
      audioSrc.connect(audioProc); audioProc.connect(silence); silence.connect(audioCtx.destination);
      $('sttOut').textContent='';
    }catch(e){$('sttOut').textContent='Audio capture error: '+e.message;}
  };
  sttSocket.onmessage=ev=>{
    let text=''; try{const p=JSON.parse(ev.data); text=p.text||p.partial||'';}catch(_){text=ev.data;}
    if(text){const o=$('sttOut'); o.textContent=(o.textContent+' '+text).trim(); o.scrollTop=o.scrollHeight;}
  };
  sttSocket.onerror=()=>{$('sttOut').textContent='Audio server not reachable on ws://127.0.0.1:2700';};
}
function stopStt(){
  try{audioProc&&audioProc.disconnect(); audioProc&&(audioProc.onaudioprocess=null);}catch(e){}
  try{audioSrc&&audioSrc.disconnect();}catch(e){}
  try{silence&&silence.disconnect();}catch(e){}
  try{audioCtx&&audioCtx.close();}catch(e){}
  audioProc=audioSrc=silence=audioCtx=null;
  if(sttSocket){try{sttSocket.send('{"eof":1}')}catch(e){} try{sttSocket.close()}catch(e){} sttSocket=null;}
}

/* ---------- Start / Stop / Restart ---------- */
async function waitBackendReady(timeoutMs=90000){
  const t0=Date.now();
  while(Date.now()-t0<timeoutMs){
    const st=await getStatus(); renderStatus(st);
    if(st&&st.vlm&&st.vlm.ready) return true;
    await new Promise(r=>setTimeout(r,1500));
  }
  return false;
}
async function startSystem(){
  $('startBtn').disabled=true;
  try{
    setBackend('busy','Starting backend…');
    $('vlmOut').textContent='Starting backend and loading model…';
    const model=$('modelSelect').value;
    const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model})});
    if(!r.ok){const t=await r.text(); throw new Error(t||('start failed '+r.status));}
    const ok=await waitBackendReady();
    if(!ok) throw new Error('Backend did not become ready in time.');

    if(source==='webcam'){ await startWebcam(); }
    else { if(!video.src){toast('Choose a video file first.'); throw new Error('No video selected'); } await video.play().catch(()=>{}); }

    running=true;
    $('stopBtn').disabled=false; $('restartBtn').disabled=false;
    const interval=parseInt($('intervalSelect').value)||1000;
    askVlm(); frameTimer=setInterval(askVlm, interval);
    startStt();
    toast('System running.');
  }catch(e){
    $('vlmOut').textContent='Could not start: '+e.message;
    setBackend('off','Backend stopped'); $('startBtn').disabled=false;
  }
}
async function stopSystem(opts={}){
  running=false;
  if(frameTimer){clearInterval(frameTimer); frameTimer=null;}
  stopStt();
  if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null;}
  video.pause();
  $('stopBtn').disabled=true; $('restartBtn').disabled=true; $('startBtn').disabled=false;
  if(!opts.keepBackend){
    setBackend('busy','Stopping backend…');
    try{await fetch('/api/stop',{method:'POST'});}catch(e){}
  }
  await refresh();
  if(!opts.silent){$('vlmOut').textContent='Stopped.'; toast('System stopped.');}
}
async function restartSystem(){
  toast('Restarting…');
  await stopSystem({silent:true});
  await new Promise(r=>setTimeout(r,400));
  await startSystem();
}
async function changeModel(){
  const model=$('modelSelect').value;
  if(!running){return;}  // applied on next Start
  setBackend('busy','Switching model…');
  try{
    await fetch('/api/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model})});
    await waitBackendReady();
    toast('Model switched to '+model);
  }catch(e){toast('Model switch failed.');}
}

async function changeSttModel(){
  const model=$('sttSelect').value;
  if(!running){return;}
  setBackend('busy','Switching speech model…');
  try{
    await fetch('/api/stt_model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model})});
    await waitBackendReady();
    toast('Speech model switched to '+model);
  }catch(e){toast('Speech model switch failed.');}
}
$('startBtn').onclick=startSystem;
$('stopBtn').onclick=()=>stopSystem();
$('restartBtn').onclick=restartSystem;
$('modelSelect').onchange=changeModel;
$('sttSelect').onchange=changeSttModel;
$('intervalSelect').onchange=()=>{ if(running){clearInterval(frameTimer); frameTimer=setInterval(askVlm, parseInt($('intervalSelect').value)||1000);} };
window.addEventListener('beforeunload',()=>{ if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop()); });

/* init */
$('fileRow').classList.add('hidden');
refresh();
pollTimer=setInterval(async()=>{ const st=await getStatus(); renderStatus(st); }, 4000);
</script>
</body>
</html>
